name: Verify Docker milestones 1, 2 and 3
on:
  push:
    paths:
      - 'Dockerfile'
      - 'requirements.lock'
      - 'pyproject.toml'
      - 'backend/**'
      - 'praat/**'
      - 'configs/**'
      - 'tests/**'
      - '.github/workflows/docker-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image including pytest
        run: docker build --progress=plain -t habla-motora:smoke-v1 .
      - name: Praat version and duration
        run: |
          docker run --rm habla-motora:smoke-v1 praat --version
          docker run --rm habla-motora:smoke-v1 python -m backend.praat_runner tests/fixtures/tone_2s.wav | tee smoke-result.json
          python -c 'import json; x=json.load(open("smoke-result.json")); assert x["temporal"]["file_duration_s"] == 2.0; assert x["provenance"]["praat_version"] == "6.4.27"'
      - name: Repeat full pytest inside container
        run: docker run --rm habla-motora:smoke-v1 python -m pytest -q
      - name: Synthetic pitch observations inside container
        run: |
          docker run --rm habla-motora:smoke-v1 python -m tests.report_pitch > pitch-result.json
          cat pitch-result.json
      - name: Synthetic jitter observations inside container
        run: |
          docker run --rm habla-motora:smoke-v1 python -m tests.report_jitter > jitter-result.json
          cat jitter-result.json
      - name: Start API and verify endpoints over HTTP
        run: |
          docker run -d --name habla-api -p 127.0.0.1:8000:8000 habla-motora:smoke-v1
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health | tee health.json
          curl -fsS -F 'file=@tests/fixtures/tone_2s.wav' http://127.0.0.1:8000/smoke-test | tee api-result.json
          python -c 'import json; h=json.load(open("health.json")); x=json.load(open("api-result.json")); assert h["status"] == "alive"; assert x["temporal"]["file_duration_s"] == 2.0; assert x["provenance"]["praat_version"] == "6.4.27"; assert x["quality"]["f0_coverage"]["value"] is None; assert x["quality"]["accepted_cycles"]["value"] is None; assert x["quality"]["technical_warnings"]'
      - name: Verify pitch HTTP endpoint
        run: |
          python -c 'from tests.synthetic_pitch import wav_bytes; from pathlib import Path; Path("tone-6s.wav").write_bytes(wav_bytes())'
          curl -fsS -F 'file=@tone-6s.wav' -F 'emission_start_s=0' -F 'emission_end_s=6' http://127.0.0.1:8000/pitch > pitch-api-result.json
          python -c 'import json; x=json.load(open("pitch-api-result.json")); assert abs(x["acoustic"]["f0_mean_hz"]["value"]-200)<0.1; assert x["quality"]["f0_coverage_percent"]["value"]==100; assert x["provenance"]["module_version"]=="pitch_v1"; print("pitch HTTP 200, F0:",x["acoustic"])'
      - name: Verify jitter HTTP endpoint
        run: |
          python -c 'from tests.synthetic_jitter import cycle_times,pulse_wav; from pathlib import Path; Path("jitter-6s.wav").write_bytes(pulse_wav(cycle_times(.5)))'
          curl -fsS -F 'file=@jitter-6s.wav' -F 'emission_start_s=0' -F 'emission_end_s=6' http://127.0.0.1:8000/jitter > jitter-api-result.json
          python -c 'import json; x=json.load(open("jitter-api-result.json")); assert abs(x["acoustic"]["jitter_local_percent"]["value"]-.5)<=.05; assert x["provenance"]["module_version"]=="jitter_v1"; print("jitter HTTP 200:",x["acoustic"]["jitter_local_percent"])'
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs habla-api 2>&1 || true
          docker rm -f habla-api || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: milestone-3-docker-results
          path: |
            smoke-result.json
            health.json
            api-result.json
            pitch-result.json
            pitch-api-result.json
            jitter-result.json
            jitter-api-result.json
